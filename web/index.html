<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Supply Chain Control Center</title><link rel="stylesheet" href="/static/app.css"></head>
<body><header><div><p class="eyebrow">OPERATIONS / CONTROL TOWER</p><h1>Supply Chain Control Center</h1><p class="muted">Shipment visibility, inventory risk, and exception triage</p></div><button id="refresh">Refresh data</button></header>
<main><section id="kpis" class="kpis"></section><section class="panel"><div class="section-head"><div><h2>Shipments</h2><p class="muted">Track status and expected arrival</p></div><div><input id="search" placeholder="Search route or reference"><select id="status"><option value="">All statuses</option><option>planned</option><option>in_transit</option><option>exception</option><option>delivered</option></select></div></div><div class="table-wrap"><table><thead><tr><th>Reference</th><th>Route</th><th>Carrier</th><th>ETA</th><th>Status</th><th>Action</th></tr></thead><tbody id="shipments"></tbody></table></div></section>
<div class="grid"><section class="panel"><h2>Inventory health</h2><div id="inventory"></div></section><section class="panel"><h2>Register shipment</h2><form id="new-shipment"><label>Reference<input name="reference" required minlength="3"></label><div class="form-row"><label>Origin<input name="origin" required></label><label>Destination<input name="destination" required></label></div><label>Carrier<input name="carrier" required></label><label>Expected arrival<input name="expected_arrival" type="datetime-local" required></label><button type="submit">Create shipment</button></form></section></div><p id="notice" role="status"></p></main><script src="/static/app.js"></script></body></html>
